ผู้ซื้อมีสิทธิ์ซื้อบัตรได้สูงสุด 6 ใบต่อการสั่งซื้อ 1 ครั้ง โดยอ้างอิงจากเลขบัตรประชาชนหรือเลขหนังสือเดินทาง ห้ามโอนสิทธิ์ให้ผู้อื่นหรือนำบัตรไปจำหน่ายต่อในราคาสูงกว่าราคาหน้าบัตรโดยเด็ดขาด`},{title:"2. ข้อมูลส่วนบุคคลและความเป็นส่วนตัว",body:`ข้อมูลที่ท่านกรอกในระบบจะถูกเก็บรวบรวมและประมวลผลตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA) บริษัทจะไม่เปิดเผยข้อมูลของท่านต่อบุคคลที่สามโดยไม่ได้รับความยินยอม ยกเว้นในกรณีที่กฎหมายกำหนด

ท่านมีสิทธิ์ขอเข้าถึง แก้ไข ลบ หรือโอนข้อมูลส่วนบุคคลของตนเองได้ตลอดเวลาผ่านช่องทางที่บริษัทกำหนด โดยบริษัทจะดำเนินการให้แล้วเสร็จภายใน 30 วันนับจากวันที่ได้รับคำร้อง`},{title:"3. นโยบายการยกเลิกและคืนเงิน",body:`ในกรณีที่ผู้จัดงานประกาศยกเลิกหรือเลื่อนกำหนดการแสดงอย่างเป็นทางการ ผู้ซื้อบัตรจะได้รับการคืนเงินเต็มจำนวนภายใน 30-45 วันทำการ นับจากวันที่ประกาศยกเลิก ค่าธรรมเนียมการดำเนินการ (Processing Fee) อาจไม่สามารถคืนได้ในบางกรณีขึ้นอยู่กับเงื่อนไขของผู้จัดงาน

หากบัตรสูญหายหรือเสียหาย บริษัทไม่รับผิดชอบต่อการสูญเสียดังกล่าว และไม่สามารถออกบัตรทดแทนให้ได้ในทุกกรณี`},{title:"4. ข้อกำหนดด้านความปลอดภัยในสถานที่จัดงาน",body:`ผู้เข้างานจะต้องปฏิบัติตามกฎระเบียบและคำแนะนำของเจ้าหน้าที่รักษาความปลอดภัยอย่างเคร่งครัด ห้ามนำสิ่งของต้องห้ามเข้าในสถานที่จัดงาน ได้แก่ อาวุธทุกประเภท สิ่งของที่มีคม ของเหลวในภาชนะที่มีปริมาตรเกิน 100 มล. กล้องถ่ายภาพแบบมืออาชีพ (DSLR / Mirrorless) และอุปกรณ์บันทึกเสียง

ผู้จัดงานสงวนสิทธิ์ในการตรวจค้นสัมภาระและปฏิเสธการเข้างานของบุคคลที่ฝ่าฝืนกฎโดยไม่คืนเงินค่าบัตร`},{title:"5. ข้อจำกัดความรับผิดชอบ",body:`บริษัทไม่รับผิดชอบต่อความเสียหายทางตรงหรือทางอ้อม อันเกิดจากการใช้งานระบบ การชำระเงินล่าช้า หรือความผิดพลาดทางเทคนิคที่อยู่นอกเหนือการควบคุมของบริษัท
